@if (visible) {

  <div
    class="modal-overlay"
    (click)="cancel()"
  >

    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      (click)="$event.stopPropagation()"
    >

      <!-- Icône -->
      <div class="modal-icon">

        <span class="material-icons">
          {{ success ? 'check_circle' : 'help_outline' }}
        </span>

      </div>


      <!-- Titre -->
      <h2>
        {{ title }}
      </h2>


      <!-- Message -->
      <p>
        {{ message }}
      </p>


      <!-- Boutons -->
      <div class="modal-actions">

        <!-- Bouton Annuler uniquement pour
             le popup de confirmation -->
        @if (!success) {

          <button
            type="button"
            class="btn btn-cancel"
            (click)="cancel()"
          >
            {{ cancelText }}
          </button>

        }


        <!-- Bouton principal -->

        <button
          type="button"
          class="btn btn-confirm"
          (click)="success ? cancel() : confirm()"
        >

          {{ success ? 'OK' : confirmText }}

        </button>

      </div>

    </div>

  </div>

}
